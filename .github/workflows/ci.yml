name: CI
# Checks only. Never deploys and never sees production secrets (safe for pull requests).
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['**.md']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (= floating v4 on 24. 11. 2026)
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      # Fixture catalog + test-mode build (also runs the asset-budget and bundle guards).
      - run: pnpm test:e2e:setup
      - run: pnpm check
      - name: e2e (Playwright, fixture iframe — no partner ads are loaded)
        run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
