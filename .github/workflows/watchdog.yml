name: Watchdog
# Independent of the Worker cron. Daily at 08:30 UTC (the sync starts 03:20 UTC and takes ~15 min):
# if any provider import is older than 36 h, an import failed, or a key page is down → re-dispatch the sync
# and fail this run (GitHub e-mails the failure). Also runnable by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 2'
permissions:
  contents: read
  actions: write
# secrets only in the step that needs them (not workflow-wide: install/setup steps never see them)
jobs:
  watchdog:
    if: github.repository == 'HuyKenny/pixuvo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (= floating v4 on 24. 11. 2026)
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: check
        run: pnpm exec tsx scripts/watchdog.ts --target remote
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          MALINA_WARM_TOKEN: ${{ secrets.MALINA_WARM_TOKEN }}
      - name: Re-dispatch the sync when stale
        if: steps.check.outcome == 'failure'
        run: gh workflow run sync.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Fail loudly
        if: steps.check.outcome == 'failure'
        run: exit 1
