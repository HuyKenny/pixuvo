name: Sync and publish
# Mon + Thu 03:20 UTC (Workers Free since 23 Nov 2026: no Cloudflare cron, pages are static shards).
# scripts/static/build.sh: export D1 -> import partner feeds, probe embeds, metrics on a LOCAL copy -> push only the
# changed rows to D1 (the API Worker reads them) -> build -> render every sitemap page from a local `wrangler dev`
# -> deploy pixuvo-z01..zNN (/games/ + language dirs), pixuvo-static (pixuvo.com/*) and the API Worker (/api/*).
# Manual "quick" run = rychlá cesta for CSS/JS/template/text fixes: no feeds, no D1 writes, just re-render + deploy.
on:
  schedule:
    - cron: '20 3 * * 1,4'
  workflow_dispatch:
    inputs:
      quick:
        description: 'Quick fix: no feed import and no D1 writes - only re-render + deploy'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    # Never from forks / pull requests.
    if: github.repository == 'HuyKenny/pixuvo'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (= floating v4 on 24. 11. 2026)
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Import + render + deploy
        run: scripts/static/build.sh ${{ (github.event_name == 'workflow_dispatch' && inputs.quick) && 'quick' || 'full' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          GAMEPIX_SID: ${{ secrets.GAMEPIX_SID }}
          PLAYGAMA_CLID: ${{ secrets.PLAYGAMA_CLID }}
          GAMEMONETIZE_FEED_URL: ${{ secrets.GAMEMONETIZE_FEED_URL }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: import-report, path: .static-work/import-report.json, if-no-files-found: ignore, retention-days: 30 }
