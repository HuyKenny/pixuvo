name: Sync and publish
# Triggered once a day by cron-job.org → POST /api/cron/sync → workflow_dispatch,
# by "Request sync" in the admin, or manually. A push to main only republishes code.
# Import runs here (never inside a Worker request); deploy happens only when data or code changed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'tests/**', '.github/workflows/ci.yml']
permissions:
  contents: read
concurrency:
  group: sync
  cancel-in-progress: false
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
  CF_I18N_DATABASE_ID: ${{ secrets.CF_I18N_DATABASE_ID }}
  GAMEPIX_SID: ${{ secrets.GAMEPIX_SID }}
  PLAYGAMA_CLID: ${{ secrets.PLAYGAMA_CLID }}
  GAMEMONETIZE_FEED_URL: ${{ secrets.GAMEMONETIZE_FEED_URL }}
  TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
jobs:
  sync:
    # Never from forks / pull requests.
    if: github.repository == 'HuyKenny/pixuvo'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Migrations (restore bookmark is printed first)
        run: pnpm exec tsx scripts/db-backup.ts && pnpm exec wrangler d1 migrations apply pixuvo-production --remote && pnpm exec wrangler d1 migrations apply pixuvo-i18n --remote
      - name: Import partner catalogs (daily write budget 90 000 rows)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec tsx scripts/import/cli.ts --target remote --budget 90000 --json import-report.json
      - name: Metrics (popular / trending / ranks)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec tsx scripts/metrics.ts --target remote
      - name: Translate new/changed descriptions of the top games (small daily budget; backfill runs elsewhere)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 10
        run: pnpm exec tsx scripts/translate.ts --top 3000 --max-usd 0.3 --max-pairs 1500 --concurrency 6
      - name: Publish (skips when nothing changed)
        run: pnpm exec tsx scripts/publish.ts --target remote --deploy
      - name: Free-tier report
        if: always()
        continue-on-error: true
        run: pnpm exec tsx scripts/verify-free-tier.ts --target remote
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: import-report, path: import-report.json, if-no-files-found: ignore, retention-days: 30 }
